[package]
name = "picasso"
version = "0.11.3"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Pure-Rust port of Picasso (jungmannlab/picasso) for single-molecule localization microscopy (SMLM), single-particle detection, 2D/3D Gaussian & spline PSF fitting, post-processing, clustering, rendering, and Lisca binding assays"
repository = "https://github.com/keejkrej/picasso-rs"
keywords = ["smlm", "dna-paint", "single-particle-tracking", "gaussian-fitting", "microscopy"]
categories = ["science", "mathematics", "algorithms", "computer-vision"]

[dependencies]
marray = { git = "https://github.com/keejkrej/marray-rs", version = "1.0.0" }
mplot = { git = "https://github.com/keejkrej/mplot-rs", version = "1.0.0" }
yeslogic-fontconfig-sys = { version = "6.0", features = ["dlopen"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"
rayon = "1.10"
tiff = "0.10"
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
tempfile = "3.12"
